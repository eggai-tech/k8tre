# This file contains the configuration for the PostgreSQL database used by Keycloak.
# https://cloudnative-pg.io/documentation/1.23/cloudnative-pg.v1/#postgresql-cnpg-io-v1-ClusterSpec
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgres-cluster
  namespace: keycloak
spec:
  instances: 1
  storage:
    # 2Gi: CNPG's instance manager refuses to start the postgres process
    # when free space falls below the WAL safety threshold; with the
    # previous 512Mi the empty base data already triggered the check and
    # the pod was stuck in CrashLoopBackOff with "Detected low-disk space
    # condition, avoid starting the instance".
    size: 2Gi
    storageClass: rwo-default
    resizeInUseVolumes: true
  imagePullPolicy: Always
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
      ephemeral-storage: "512Mi" # Adding explicit ephemeral storage limit
  managed:
    roles:
      - name: keycloak-user
        ensure: present
        comment: "Keycloak user role"
        login: true
        superuser: false
        passwordSecret:
          name: keycloak-db-secret
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak-user
      secret:
        name: keycloak-db-secret
      postInitApplicationSQL:
        - create schema if not exists keycloak;
